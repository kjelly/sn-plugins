name: Verify plugins

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Mise runtimes
        uses: jdx/mise-action@v3
        with:
          version: "2026.9.1"
          cache: true

      - name: Verify plugins
        run: mise run ci:verify
