name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/markdown-notes-plus/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.34.0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build plugin repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix packages/markdown-notes-plus
          npx --prefix packages/markdown-notes-plus playwright install --with-deps chromium firefox
          npm run --prefix packages/markdown-notes-plus test:e2e:release
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${{ vars.PAGES_BASE_URL }}"
          if [[ -z "${BASE_URL}" ]]; then
            BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          fi

          python3 scripts/build.py \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --base-url "${BASE_URL}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
