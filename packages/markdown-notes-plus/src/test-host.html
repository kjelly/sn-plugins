<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Mock Standard Notes Host</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f0f0f0;
      }
      #editor-frame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="editor-frame" src="./index.html" title="Markdown Notes+"></iframe>
    <script>
      (function() {
        const iframe = document.getElementById("editor-frame");
        let streamContextMessageId = null;
        let registered = false;
        let currentNote = {
          uuid: "default-note-uuid",
          content_type: "Note",
          content: {
            text: "# Welcome to Markdown Notes+\n\n- [ ] Task 1\n- [x] Completed task\n\n## Section 2\n\nSome paragraph text.",
            appData: {
              "org.standardnotes.sn": {
                locked: false
              }
            }
          }
        };

        const receivedSaves = [];
        const saveListeners = [];
        let handshakeResolve = null;
        const handshakePromise = new Promise((resolve) => {
          handshakeResolve = resolve;
        });

        function sendRegistration() {
          if (!iframe.contentWindow) return;
          iframe.contentWindow.postMessage({
            action: "component-registered",
            sessionKey: "mock-sn-session-key",
            componentData: {},
            data: {
              environment: "web",
              platform: "web",
              uuid: "mock-plugin-uuid",
              activeThemeUrls: []
            }
          }, "*");
        }

        // Try registering periodically until handshake completes
        const regInterval = setInterval(() => {
          if (registered) {
            clearInterval(regInterval);
          } else {
            sendRegistration();
          }
        }, 50);

        window.addEventListener("message", (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== "object") return;

          if (msg.action === "stream-context-item") {
            registered = true;
            streamContextMessageId = msg.messageId;
            clearInterval(regInterval);
            if (handshakeResolve) handshakeResolve();

            // Reply with current note
            iframe.contentWindow.postMessage({
              action: "reply",
              original: { messageId: streamContextMessageId },
              data: {
                item: currentNote
              }
            }, "*");
          } else if (msg.action === "save-items") {
            const items = msg.data?.items || [];
            if (items.length > 0 && items[0].content?.text !== undefined && currentNote) {
              currentNote.content.text = items[0].content.text;
            }
            receivedSaves.push({
              timestamp: Date.now(),
              items: items,
              raw: msg
            });

            // Notify any listeners
            for (const listener of saveListeners) {
              try { listener(items); } catch (_) {}
            }

            // Reply to acknowledge save
            if (msg.messageId) {
              iframe.contentWindow.postMessage({
                action: "reply",
                original: { messageId: msg.messageId },
                data: {}
              }, "*");
            }
          } else if (msg.action === "themes-activated") {
            // Handshake sub-step
          }
        });

        window.__SN_MOCK_HOST__ = {
          getSaves() {
            return receivedSaves;
          },
          getLatestSave() {
            return receivedSaves[receivedSaves.length - 1];
          },
          getLatestSavedText() {
            const latest = receivedSaves[receivedSaves.length - 1];
            return latest?.items?.[0]?.content?.text;
          },
          clearSaves() {
            receivedSaves.length = 0;
          },
          setNote(text, uuid = "note-" + Date.now(), locked = false) {
            currentNote = {
              uuid: uuid,
              content_type: "Note",
              content: {
                text: text,
                appData: {
                  "org.standardnotes.sn": {
                    locked: locked
                  }
                }
              }
            };
            if (streamContextMessageId && iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                action: "reply",
                original: { messageId: streamContextMessageId },
                data: {
                  item: currentNote
                }
              }, "*");
            }
          },
          updateCurrentNote(text) {
            if (!currentNote) return;
            currentNote.content.text = text;
            if (streamContextMessageId && iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                action: "reply",
                original: { messageId: streamContextMessageId },
                data: {
                  item: currentNote
                }
              }, "*");
            }
          },
          setLocked(locked) {
            if (!currentNote) return;
            if (!currentNote.content.appData) currentNote.content.appData = {};
            if (!currentNote.content.appData["org.standardnotes.sn"]) {
              currentNote.content.appData["org.standardnotes.sn"] = {};
            }
            currentNote.content.appData["org.standardnotes.sn"].locked = locked;
            if (streamContextMessageId && iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                action: "reply",
                original: { messageId: streamContextMessageId },
                data: {
                  item: currentNote
                }
              }, "*");
            }
          },
          setThemes(themeUrls) {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                action: "themes",
                data: {
                  themes: themeUrls
                }
              }, "*");
            }
          },
          waitForHandshake() {
            return handshakePromise;
          },
          waitForNextSave(timeoutMs = 3000) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                const idx = saveListeners.indexOf(listener);
                if (idx >= 0) saveListeners.splice(idx, 1);
                reject(new Error("Timeout waiting for save"));
              }, timeoutMs);
              const listener = (items) => {
                clearTimeout(timer);
                const idx = saveListeners.indexOf(listener);
                if (idx >= 0) saveListeners.splice(idx, 1);
                resolve(items);
              };
              saveListeners.push(listener);
            });
          }
        };
      })();
    </script>
  </body>
</html>
